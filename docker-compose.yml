services:

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    networks:
      - finnhub
    ports:
      # Truy cập Kafka từ máy host bằng localhost:9093
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      # KRaft identity
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # KRaft controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Kafka listeners
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: >
        PLAINTEXT://kafka:9092,
        CONTROLLER://kafka:29093,
        PLAINTEXT_HOST://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:9092,
        PLAINTEXT_HOST://localhost:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Single-node development environment
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_SEGMENT_BYTES: 10485760

      # KRaft cluster ID — dùng cố định cho local development
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    healthcheck:
      # Có healthcheck thì producer mới đợi được bằng service_healthy bên dưới.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  producer:
    build:
      # Context là thư mục gốc repo vì Dockerfile cần pyproject.toml + uv.lock ở đây.
      context: .
      dockerfile: finnhubproducer/Dockerfile
    networks:
      - finnhub
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      KAFKA_SERVER: kafka:9092
      KAFKA_TOPIC_NAME: market
      FINNHUB_STOCKS_TICKERS: BINANCE:BTCUSDT,BINANCE:ETHUSDT
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks:
      - finnhub
    ports:
      # psql -h localhost -p 5434 -U finnhub -d finnhub
      - "5434:5432"
    environment:
      POSTGRES_DB: finnhub
      POSTGRES_USER: finnhub
      POSTGRES_PASSWORD: finnhub
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script trong này chỉ chạy khi volume còn trống (lần khởi tạo đầu tiên).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finnhub -d finnhub"]
      interval: 10s
      timeout: 5s
      retries: 10

  spark-streaming:
    build:
      context: .
      dockerfile: sparkstreaming/Dockerfile
    networks:
      - finnhub
    ports:
      # Spark UI: http://localhost:4040 — tab Structured Streaming xem input rate,
      # batch duration và số dòng bị loại vì đến muộn.
      - "4040:4040"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_SERVER: kafka:9092
      KAFKA_TOPIC_NAME: market
      # earliest chỉ có tác dụng ở lần chạy đầu; sau đó Spark theo checkpoint.
      KAFKA_STARTING_OFFSETS: earliest

      WINDOW_SECONDS: 60
      WATERMARK_SECONDS: 60
      TRIGGER_SECONDS: 20

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: finnhub
      POSTGRES_USER: finnhub
      POSTGRES_PASSWORD: finnhub

      CHECKPOINT_LOCATION: /opt/spark-checkpoints
      TZ: UTC
    volumes:
      # Checkpoint giữ offset Kafka + state của các cửa sổ đang mở. Xoá volume này
      # là job đọc lại từ đầu và mất các cửa sổ chưa đóng.
      - spark_checkpoints:/opt/spark-checkpoints
    restart: on-failure

networks:
  finnhub:
    driver: bridge

volumes:
  kafka_data:
  postgres_data:
  spark_checkpoints:
